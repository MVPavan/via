[package]
name = "via-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only failpoint controller (runtime-contracts §11); default off.
test-failpoints = ["via-store/test-failpoints"]

[dependencies]
via-store = { path = "../via-store" }
tokio = { workspace = true, features = ["process", "net", "io-util", "time", "sync", "rt", "signal"] }
rustix = { workspace = true, features = ["process", "stdio", "fs", "time", "event", "param"] }
process-wrap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

# OC02b fence fixtures (vendors/opencode.md §13): the test binary is also
# the anchor, the exec entry (`/proc/self/exe __via_host_exec`) and the fake
# vendor, which libtest's argument parsing cannot host; its own `main` keeps
# libtest's list and filter interface for nextest.
[[test]]
name = "oc02b_fence"
harness = false

[lints]
workspace = true
