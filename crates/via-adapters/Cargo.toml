[package]
name = "via-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only failpoint controller (runtime-contracts §11); default off.
test-failpoints = ["via-routes/test-failpoints"]

[dependencies]
via-routes = { path = "../via-routes" }
tokio = { workspace = true, features = ["time", "sync", "rt", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustix = { workspace = true, features = ["fs"] }
# The expected Claude session UUID (ruling Q4) and the Codex launch digest.
sha2 = { workspace = true }

[dev-dependencies]
# The Codex decline bodies validate against the vendor schemas (x.3.2 X1).
boon = { workspace = true }
tempfile = { workspace = true }
# Paused time (`start_paused`, `advance`) for the Codex driver tests.
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
# The scripted Codex server and its Route runtime, test builds only
# (x.3.2 X4; resolver 3 keeps the feature out of production builds).
via-routes = { path = "../via-routes", features = ["test-support"] }

[lints]
workspace = true
