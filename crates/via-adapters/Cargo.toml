[package]
name = "via-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only failpoint controller (runtime-contracts §11); default off.
test-failpoints = ["via-routes/test-failpoints"]

[dependencies]
via-routes = { path = "../via-routes" }
tokio = { workspace = true, features = ["time", "sync", "rt", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustix = { workspace = true, features = ["fs"] }
# Ruling Q4: the expected Claude session UUID (SHA-256).
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
