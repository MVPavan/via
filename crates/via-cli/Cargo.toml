[package]
name = "via-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "via"
path = "src/main.rs"

[dependencies]
via-core = { path = "../via-core" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
rustix = { workspace = true, features = ["process", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true, features = ["backup"] }
rustix = { workspace = true, features = ["process", "thread", "net", "time"] }
sha2 = { workspace = true }

[lints]
workspace = true
