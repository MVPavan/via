[package]
name = "via-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only failpoint controller (runtime-contracts §11); default off.
test-failpoints = ["via-adapters/test-failpoints", "via-store/test-failpoints"]

[dependencies]
via-adapters = { path = "../via-adapters" }
via-store = { path = "../via-store" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
sha2 = { workspace = true }
boon = { workspace = true }

[dev-dependencies]
# Tests drive Store's test seams.
via-store = { path = "../via-store", features = ["test-failpoints"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
